<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringBoard Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex md:flex-row flex-col">

    <aside class="sidebar md:w-64 w-full md:relative fixed md:translate-x-0 -translate-x-full md:h-auto h-screen md:z-auto z-[1000] transition-transform duration-300">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i data-lucide="layout-dashboard"></i>
            </div>
            <div class="sidebar-title">
                <h1>SpringBoard</h1>
                <p>Room Management</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" onclick="loadPage('dashboard', event)" class="nav-link active" data-page="dashboard">
                <i data-lucide="layout-grid"></i> Dashboard
            </a>
            <a href="#" onclick="loadPage('rooms', event)" class="nav-link" data-page="rooms">
                <i data-lucide="building-2"></i> Room Directory
            </a>
            <a href="#" onclick="loadPage('booking', event)" class="nav-link">
                <i data-lucide="calendar"></i> Bookings
            </a>
            <a href="#" onclick="loadPage('users', event)" class="nav-link">
                <i data-lucide="users"></i> Users
            </a>
            <a href="#" class="nav-link">
                <i data-lucide="package"></i> Packages
            </a>
            <a href="#" class="nav-link">
                <i data-lucide="briefcase"></i> Companies
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar">JS</div>
                <div class="user-info">
                    <p class="user-name">John Smith</p>
                    <p class="user-role">Admin</p>
                </div>
            </div>
        </div>
    </aside>
    
    <main class="main-content" id="main-content">
        <!-- Dashboard Page -->
        
    </main>
    
    <script>
        lucide.createIcons();
    </script>
    <script src="../js/app.js"></script>
</body>
</html>
